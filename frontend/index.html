<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #6a5af9;
      --secondary-color: #d13e69;
      --text-color: #e4e4e4;
      --bg-color: #1c1c2e;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --shadow-color: rgba(0, 0, 0, 0.2);
      
      /* Action Button Colors */
      --color-show: #03a9f4;  /* Light Blue */
      --color-edit: #ffc107;  /* Amber */
      --color-delete: #f44336; /* Red */

      /* Hover Glow Colors */
      --shadow-show: rgba(3, 169, 244, 0.5);
      --shadow-edit: rgba(255, 193, 7, 0.5);
      --shadow-delete: rgba(244, 67, 54, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(45deg, var(--bg-color), #2a2a4e);
      color: var(--text-color);
      padding: 2rem;
      min-height: 100vh;
    }

    .main-title {
        text-align: center;
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 2rem;
        color: #fff;
        text-shadow: 0 2px 10px var(--shadow-color);
    }
    
    .app-layout {
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 2rem;
        max-width: 1200px;
        margin: auto;
    }

    .glass-container {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        box-shadow: 0 4px 30px var(--shadow-color);
        padding: 1.5rem;
    }
    
    h3 {
        font-weight: 600;
        margin-bottom: 1.5rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--glass-border);
        color: #fff;
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text-color);
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    input::placeholder, textarea::placeholder {
        color: rgba(255,255,255,0.5);
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      background: rgba(0,0,0,0.3);
    }

    textarea {
        resize: vertical;
        min-height: 80px;
    }
    
    .controls {
        display: flex;
        gap: 0.75rem;
    }

    button {
      flex-grow: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    
    button svg {
        width: 16px;
        height: 16px;
        fill: #fff;
    }

    #saveBtn { background: var(--primary-color); }
    #saveBtn:hover { background: #5a48e3; transform: translateY(-2px); }
    
    #clearBtn { background: var(--secondary-color); }
    #clearBtn:hover { background: #c12e59; transform: translateY(-2px); }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.9rem;
      text-align: left;
      border-bottom: 1px solid var(--glass-border);
    }

    th {
      font-weight: 600;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
    }

    tbody tr {
        transition: background-color 0.3s ease;
    }

    tbody tr:hover {
        background: var(--glass-bg);
    }
    
    td {
        font-size: 0.9rem;
    }
    
    td:last-child {
        background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(255,255,255,0.05) 100%);
    }

    .actions-cell {
        display: flex;
        gap: 0.5rem;
        align-items: center;
    }

    .actions-cell button {
        padding: 0.5rem;
        border-radius: 50%;
        flex-grow: 0;
        width: 38px;
        height: 38px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    .actions-cell button.show { background-color: var(--color-show); }
    .actions-cell button.edit { background-color: var(--color-edit); }
    .actions-cell button.del { background-color: var(--color-delete); }
    
    .actions-cell button:hover {
        transform: scale(1.1) translateY(-2px);
        filter: brightness(1.15);
    }
    
    .actions-cell button.show:hover { box-shadow: 0 4px 15px var(--shadow-show); }
    .actions-cell button.edit:hover { box-shadow: 0 4px 15px var(--shadow-edit); }
    .actions-cell button.del:hover { box-shadow: 0 4px 15px var(--shadow-delete); }

    .actions-cell svg { fill: #fff; }

    .masked {
      filter: blur(5px);
      transition: filter 0.3s ease;
    }
    
    tr:hover .masked {
        filter: blur(0px);
    }
    
    @media (max-width: 900px) {
        .app-layout {
            grid-template-columns: 1fr;
        }
        body {
            padding: 1rem;
        }
    }
  </style>
</head>
<body>

  <h1 class="main-title">Contact Manager</h1>
  
  <div class="app-layout">
    <div class="glass-container">
        <h3>Add / Update Contact</h3>
        <input id="name" placeholder="Full name" />
        <input id="phone" type="tel" placeholder="Phone (10 digits)" />
        <input id="email" type="email" placeholder="Email" />
        <textarea id="address" placeholder="Address"></textarea>
        <div class="controls">
          <button id="saveBtn" type="button"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>Save</button>
          <button id="clearBtn" type="button"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>Clear</button>
        </div>
    </div>
    
    <div class="glass-container">
        <h3>Contact List</h3>
        <input id="search" placeholder="Search contacts..." style="margin-bottom: 1.5rem;" />
        <div style="overflow-x: auto;">
            <table id="contactsTable">
              <thead>
                <tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Actions</th></tr>
              </thead>
              <tbody></tbody>
            </table>
        </div>
    </div>
  </div>

  <!-- Load external app.js -->
  <script src="app.js"></script>
</body>
</html>
